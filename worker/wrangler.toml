# Cloudflare Worker for the AI Coach. Secrets are NOT stored here:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put COACH_ACCESS_CODE
name = "im703-coach"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://jalmanza12.github.io,http://localhost:8080"
COACH_MODEL = "claude-opus-5-5"
COACH_EFFORT = "medium"
# Set to "true" to return clearly labeled mock replies when ANTHROPIC_API_KEY is absent.
MOCK_MODE = "false"

[observability]
enabled = true
