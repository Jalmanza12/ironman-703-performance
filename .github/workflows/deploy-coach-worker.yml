name: Deploy AI Coach Worker

# Deploys worker/ to Cloudflare Workers. Requires repository secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  (Cloudflare)
#   ANTHROPIC_API_KEY, COACH_ACCESS_CODE          (uploaded as Worker secrets, never committed)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-coach-worker.yml']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping Worker deploy. See docs/ai-coach.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Install worker dependencies
        if: steps.creds.outputs.ready == 'true'
        working-directory: worker
        run: npm ci
      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            ANTHROPIC_API_KEY
            COACH_ACCESS_CODE
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COACH_ACCESS_CODE: ${{ secrets.COACH_ACCESS_CODE }}
